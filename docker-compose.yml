version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: brandkit-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: brandkit_generator
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7.4-alpine
    container_name: brandkit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: brandkit-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  mongodb_data:
  redis_data:
